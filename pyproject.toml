[project]
name = "simstars"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "choksis8168", email = "shreya.choksi@yahoo.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.122.0",
    "elevenlabs>=2.64.0",
    "fastapi>=0.141.1",
    "fastembed>=0.7.4",
    "langgraph>=1.2.11",
    "onnxruntime==1.23.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "typer>=0.27.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
simstars = "simstars.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
